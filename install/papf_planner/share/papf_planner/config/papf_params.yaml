papf_node:
  ros__parameters:

    # --- Lookahead and Obstacle Detection ---
    # Increased for full-scale golf cart operation at higher speeds
    lookahead_distance: 15.0      # Increased from 10.0 (golf cart needs more lookahead)
    voxel_size: 0.2               # Increased from 0.1 (coarser grid for faster processing)
    obstacle_point_radius: 0.2    # Increased from 0.1 (larger obstacles for golf cart scale)
    virtual_wall_points: 20       # Increased from 10 (more safety points)
    virtual_wall_distance: 1.5    # Increased from 0.5 (larger safety zone behind vehicle)

    # --- Planning Parameters ---
    max_plan_steps: 1000          # Increased from 500 (longer paths for golf cart)
    goal_tolerance: 2.0           # Increased from 1.0 (larger vehicle needs bigger tolerance)

    # --- Potential Field - Attraction ---
    papf.k_att: 3.0               # Decreased from 5.0 (gentler attraction for stability)
    papf.d_g: 5.0                 # Increased from 3.0 (wider attraction zone)

    # --- Potential Field - Repulsion ---
    papf.k_rep: 3.0               # Increased from 2.0 (stronger obstacle repulsion)
    papf.d_o: 1.5                 # Increased from 0.5 (larger obstacle influence zone)
    papf.n: 2                     # Keep same (repulsive force exponent)

    # --- Potential Field - Predictive ---
    papf.k_prd: 3.0               # Increased from 2.0 (stronger predictive force)
    papf.d_prd: 3.0               # Increased from 2.0 (larger predictive distance)

    # --- Vehicle Dynamics (TUNED FOR GOLF CART) ---
    papf.max_turning_angle_deg: 15.0   # Increased from 2.0 (golf carts can turn more)
    papf.v_c: 2.0                      # Characteristic velocity (m/s)
    papf.v_min: 0.3                    # Decreased from 0.5 (golf carts can go slower)
    papf.v_max: 4.0                    # Increased from 3.0 (golf cart max speed ~14 km/h)
    papf.max_acceleration: 0.8         # Decreased from 1.0 (golf carts accelerate slower)
    papf.max_deceleration: 1.5         # Increased from 1.0 (golf carts can brake better)
    papf.dt: 0.1                       # Increased from 0.05 (planning timestep)